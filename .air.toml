
root = "."

[build]
  bin = "./tmp/main"
  cmd = "go build -o ./tmp/main ."
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor"]
  exclude_regex = ["_test.go"]
  log = "build-errors.log"
  stop_on_error = true
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "sql", ".env"]

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
# Delete tmp directory on exit
clean_on_exit = true